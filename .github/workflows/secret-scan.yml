name: Secret scanning (full Git history)

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks full-history audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history and all branches
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check all reachable Git history for secrets
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/repo:ro" --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --log-opts=--all --redact --exit-code=1 /repo
