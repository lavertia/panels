name: Laravel Modular runtime

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v0.*"]
  pull_request:

permissions:
  contents: read

jobs:
  real-modular:
    name: Laravel 13 + InterNACHI/modular + route cache
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: playground/react
    steps:
      - name: Checkout Panels under test
        uses: actions/checkout@v4
        with:
          path: panels
      - name: Checkout Laravel Playground
        uses: actions/checkout@v4
        with:
          repository: lavertia/playground
          ref: main
          path: playground
      - name: Checkout Support
        uses: actions/checkout@v4
        with:
          repository: lavertia/support
          ref: main
          path: support
      - name: Checkout Forms
        uses: actions/checkout@v4
        with:
          repository: lavertia/forms
          ref: main
          path: forms
      - name: Checkout Tables
        uses: actions/checkout@v4
        with:
          repository: lavertia/tables
          ref: main
          path: tables
      - name: Configure PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, simplexml
          tools: composer:v2
          coverage: none
      - name: Install real module and verify dynamic/cached routes
        run: bash ../../panels/tests/integration/modular/run.sh
