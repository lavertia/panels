name: checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2
      - run: composer validate --no-check-publish
      - run: find src config tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: |
          test -f resources/stubs/react/renderer.tsx
          test -f resources/stubs/vue/renderer.vue
          test -f resources/stubs/svelte/renderer.svelte
          test -f resources/stubs/shared/types.ts

  adapters:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [react, vue, svelte]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm run test:adapters -- ${{ matrix.stack }}

  php-tests:
    name: PHP / Testbench / ${{ matrix.php }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4"]
    defaults:
      run:
        working-directory: panels
    steps:
      - uses: actions/checkout@v4
        with:
          path: panels
      - uses: actions/checkout@v4
        with:
          repository: lavertia/support
          ref: main
          path: support
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - name: Install public support dependency and run real tests
        run: |
          composer config repositories.lavertia-support '{"type":"path","url":"../support","options":{"symlink":true,"versions":{"lavertia/support":"0.1.0"}}}'
          composer install --no-interaction --prefer-dist --no-progress
          composer test:smoke
          composer test
          composer lint

  required:
    name: Required foundation checks
    needs: [lint, adapters, php-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Reject skipped or failed jobs
        run: |
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.adapters.result }}" = "success"
          test "${{ needs.php-tests.result }}" = "success"
