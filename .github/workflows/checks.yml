name: checks
on:
  push:
    branches: [main, "feat/**"]
    tags: ["v0.*"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2
      - run: composer validate --no-check-publish
      - run: find src config tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: |
          test -f resources/stubs/react/renderer.tsx
          test -f resources/stubs/vue/renderer.vue
          test -f resources/stubs/svelte/renderer.svelte
          test -f resources/stubs/shared/types.ts

  adapters:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [react, vue, svelte]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm run test:runtime
      - run: npm run test:adapters -- ${{ matrix.stack }}

  php-gate:
    name: PHP dependency access
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.inspect.outputs.available }}
    steps:
      - name: Detect accessible Support dependency
        id: inspect
        env:
          LAVERTIA_READ_TOKEN: ${{ secrets.LAVERTIA_READ_TOKEN }}
        run: |
          if [ -n "$LAVERTIA_READ_TOKEN" ] \
            || curl -fsS --max-time 10 -o /dev/null https://api.github.com/repos/lavertia/support; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PHP integration tests not run. Set LAVERTIA_READ_TOKEN while Support is private."
            echo "## PHPUnit / Testbench: BLOCKED" >> "$GITHUB_STEP_SUMMARY"
            echo "Private lavertia/support access unavailable. Adapter runtime/build checks cannot substitute for PHP tests." >> "$GITHUB_STEP_SUMMARY"
          fi

  php-tests:
    name: PHPUnit / Testbench
    needs: [lint, php-gate]
    if: needs.php-gate.outputs.available == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panels
    steps:
      - uses: actions/checkout@v4
        with:
          path: panels
      - name: Checkout Support
        uses: actions/checkout@v4
        with:
          repository: lavertia/support
          ref: main
          token: ${{ secrets.LAVERTIA_READ_TOKEN || github.token }}
          path: support
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none
      - name: Resolve PHP dependencies from local protocol
        run: |
          composer config repositories.lavertia-support '{"type":"path","url":"../support","options":{"symlink":true,"versions":{"lavertia/support":"0.1.0"}}}'
          composer install --no-interaction --prefer-dist --no-progress
      - name: PHP smoke and PHPUnit
        run: |
          composer test:smoke
          composer test
      - name: PSR style
        run: composer lint

  release-gate:
    name: v0 release verification
    needs: [lint, adapters, php-gate, php-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all mandatory jobs ran successfully
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] \
            || [ "${{ needs.adapters.result }}" != "success" ] \
            || [ "${{ needs.php-gate.outputs.available }}" != "true" ] \
            || [ "${{ needs.php-tests.result }}" != "success" ]; then
            echo "::error::v0 release blocked: full adapter and PHP/Testbench checks must pass. Skipped jobs are not release successes."
            exit 1
          fi
          echo "v0 release quality gate passed."
